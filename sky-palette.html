layout: none

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天空色卡 - Sky Color Palette</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #1a1a2e;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  color: #fff;
}

h1 {
  margin: 40px 0 10px;
  font-size: 28px;
  font-weight: 300;
  letter-spacing: 4px;
}

.subtitle {
  font-size: 14px;
  color: #aaa;
  margin-bottom: 30px;
}

/* Upload area */
.upload-area {
  width: 90%;
  max-width: 500px;
  border: 2px dashed #555;
  border-radius: 16px;
  padding: 60px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  background: rgba(255,255,255,0.03);
  position: relative;
}

.upload-area:hover {
  border-color: #f0c5bc;
  background: rgba(240,197,188,0.05);
}

.upload-area.dragging {
  border-color: #f0c5bc;
  background: rgba(240,197,188,0.08);
}

.upload-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.6;
}

.upload-text {
  font-size: 16px;
  color: #999;
}

.upload-hint {
  font-size: 12px;
  color: #666;
  margin-top: 8px;
}

input[type="file"] { display: none; }

/* Result card */
.result-container {
  display: none;
  width: 90%;
  max-width: 700px;
  margin: 30px auto;
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.palette-card {
  background: #f5f0eb;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  display: flex;
  flex-direction: row;
}

.photo-side {
  flex: 1;
  min-height: 400px;
  position: relative;
  overflow: hidden;
}

.photo-side img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 12px;
  margin: 10px;
  width: calc(100% - 20px);
  height: calc(100% - 20px);
}

.colors-side {
  width: 220px;
  display: flex;
  flex-direction: column;
  padding: 10px;
  gap: 6px;
}

.color-strip {
  flex: 1;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Courier New', monospace;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
}

.color-strip:hover {
  transform: scale(1.03);
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.color-strip .copied-tip {
  position: absolute;
  font-size: 12px;
  opacity: 0;
  transition: opacity 0.3s;
}

.color-strip .copied-tip.show {
  opacity: 1;
}

/* Buttons */
.actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn {
  padding: 10px 24px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.08);
  color: #fff;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
}

.btn:hover {
  background: rgba(255,255,255,0.15);
  border-color: rgba(255,255,255,0.4);
}

.btn-primary {
  background: rgba(240,197,188,0.2);
  border-color: rgba(240,197,188,0.4);
}

.btn-primary:hover {
  background: rgba(240,197,188,0.35);
}

/* Loading */
.loading {
  display: none;
  text-align: center;
  margin: 40px 0;
}

.loading .spinner {
  width: 40px;
  height: 40px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: #f0c5bc;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Color count selector */
.options-bar {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.options-bar label {
  font-size: 14px;
  color: #aaa;
}

.options-bar select {
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid #555;
  background: #2a2a3e;
  color: #fff;
  font-size: 14px;
}

/* Canvas hidden */
canvas { display: none; }

/* Responsive */
@media (max-width: 600px) {
  .palette-card {
    flex-direction: column;
  }
  .photo-side {
    min-height: 300px;
  }
  .colors-side {
    width: 100%;
    flex-direction: row;
    height: 80px;
    padding: 8px;
  }
  .color-strip {
    font-size: 11px;
  }
  h1 { font-size: 22px; }
}
</style>
</head>
<body>

<h1>天空色卡</h1>
<p class="subtitle">上传一张天空的照片，提取专属配色方案</p>

<div class="options-bar">
  <label>提取颜色数量：</label>
  <select id="colorCount">
    <option value="5">5 色</option>
    <option value="7" selected>7 色</option>
    <option value="9">9 色</option>
  </select>
</div>

<div class="upload-area" id="uploadArea">
  <div class="upload-icon">🌅</div>
  <div class="upload-text">点击上传 或 拖拽图片到此处</div>
  <div class="upload-hint">支持 JPG / PNG / WebP</div>
  <input type="file" id="fileInput" accept="image/*">
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>正在分析天空色彩...</p>
</div>

<div class="result-container" id="resultContainer">
  <div class="palette-card" id="paletteCard">
    <div class="photo-side">
      <img id="previewImg" src="" alt="sky">
    </div>
    <div class="colors-side" id="colorsSide">
    </div>
  </div>
  <div class="actions">
    <button class="btn btn-primary" id="btnReupload">重新上传</button>
    <button class="btn" id="btnDownload">下载色卡</button>
  </div>
</div>

<canvas id="canvas"></canvas>
<canvas id="exportCanvas"></canvas>

<script>
const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');
const loading = document.getElementById('loading');
const resultContainer = document.getElementById('resultContainer');
const previewImg = document.getElementById('previewImg');
const colorsSide = document.getElementById('colorsSide');
const colorCountSel = document.getElementById('colorCount');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Upload handlers
uploadArea.addEventListener('click', () => fileInput.click());

uploadArea.addEventListener('dragover', e => {
  e.preventDefault();
  uploadArea.classList.add('dragging');
});

uploadArea.addEventListener('dragleave', () => {
  uploadArea.classList.remove('dragging');
});

uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.classList.remove('dragging');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) processFile(file);
});

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) processFile(e.target.files[0]);
});

document.getElementById('btnReupload').addEventListener('click', () => {
  resultContainer.style.display = 'none';
  uploadArea.style.display = '';
  document.querySelector('.options-bar').style.display = '';
  fileInput.value = '';
});

document.getElementById('btnDownload').addEventListener('click', downloadCard);

let currentColors = [];
let currentImgSrc = '';

function processFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    currentImgSrc = e.target.result;
    uploadArea.style.display = 'none';
    document.querySelector('.options-bar').style.display = 'none';
    loading.style.display = 'block';

    const img = new Image();
    img.onload = () => {
      extractColors(img);
      loading.style.display = 'none';
    };
    img.src = currentImgSrc;
  };
  reader.readAsDataURL(file);
}

function extractColors(img) {
  // Draw image to canvas (scale down for performance)
  const maxDim = 200;
  const scale = Math.min(maxDim / img.width, maxDim / img.height, 1);
  canvas.width = Math.floor(img.width * scale);
  canvas.height = Math.floor(img.height * scale);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const pixels = [];

  for (let i = 0; i < imageData.data.length; i += 4) {
    const r = imageData.data[i];
    const g = imageData.data[i + 1];
    const b = imageData.data[i + 2];
    const a = imageData.data[i + 3];
    if (a < 128) continue;
    pixels.push([r, g, b]);
  }

  const k = parseInt(colorCountSel.value);
  const colors = kMeans(pixels, k);

  // Sort colors by brightness (light to dark)
  colors.sort((a, b) => {
    const la = 0.299 * a[0] + 0.587 * a[1] + 0.114 * a[2];
    const lb = 0.299 * b[0] + 0.587 * b[1] + 0.114 * b[2];
    return lb - la;
  });

  currentColors = colors;
  previewImg.src = currentImgSrc;
  renderColors(colors);
  resultContainer.style.display = 'block';
}

// K-Means clustering
function kMeans(pixels, k, maxIter = 20) {
  if (pixels.length === 0) return [];

  // Initialize centroids using k-means++
  const centroids = [pixels[Math.floor(Math.random() * pixels.length)].slice()];

  for (let c = 1; c < k; c++) {
    const dists = pixels.map(p => {
      let minD = Infinity;
      for (const cent of centroids) {
        const d = colorDist(p, cent);
        if (d < minD) minD = d;
      }
      return minD;
    });
    const total = dists.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < dists.length; i++) {
      r -= dists[i];
      if (r <= 0) {
        centroids.push(pixels[i].slice());
        break;
      }
    }
    if (centroids.length <= c) {
      centroids.push(pixels[Math.floor(Math.random() * pixels.length)].slice());
    }
  }

  // Iterate
  let assignments = new Array(pixels.length);
  for (let iter = 0; iter < maxIter; iter++) {
    // Assign pixels to nearest centroid
    let changed = false;
    for (let i = 0; i < pixels.length; i++) {
      let minD = Infinity, minC = 0;
      for (let c = 0; c < centroids.length; c++) {
        const d = colorDist(pixels[i], centroids[c]);
        if (d < minD) { minD = d; minC = c; }
      }
      if (assignments[i] !== minC) {
        assignments[i] = minC;
        changed = true;
      }
    }
    if (!changed) break;

    // Update centroids
    const sums = Array.from({ length: k }, () => [0, 0, 0]);
    const counts = new Array(k).fill(0);
    for (let i = 0; i < pixels.length; i++) {
      const c = assignments[i];
      sums[c][0] += pixels[i][0];
      sums[c][1] += pixels[i][1];
      sums[c][2] += pixels[i][2];
      counts[c]++;
    }
    for (let c = 0; c < k; c++) {
      if (counts[c] > 0) {
        centroids[c] = [
          Math.round(sums[c][0] / counts[c]),
          Math.round(sums[c][1] / counts[c]),
          Math.round(sums[c][2] / counts[c])
        ];
      }
    }
  }

  return centroids;
}

function colorDist(a, b) {
  const dr = a[0] - b[0], dg = a[1] - b[1], db = a[2] - b[2];
  return dr * dr + dg * dg + db * db;
}

function rgbToHex(r, g, b) {
  return ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
}

function textColor(r, g, b) {
  const lum = 0.299 * r + 0.587 * g + 0.114 * b;
  return lum > 160 ? '#555' : '#fff';
}

function renderColors(colors) {
  colorsSide.innerHTML = '';
  colors.forEach(([r, g, b]) => {
    const hex = rgbToHex(r, g, b);
    const strip = document.createElement('div');
    strip.className = 'color-strip';
    strip.style.background = `#${hex}`;
    strip.style.color = textColor(r, g, b);
    strip.textContent = hex;
    strip.title = '点击复制色值';
    strip.addEventListener('click', () => {
      navigator.clipboard.writeText('#' + hex).then(() => {
        const orig = strip.textContent;
        strip.textContent = '已复制!';
        setTimeout(() => strip.textContent = orig, 1000);
      });
    });
    colorsSide.appendChild(strip);
  });
}

// Download as image
function downloadCard() {
  const exportCanvas = document.getElementById('exportCanvas');
  const ectx = exportCanvas.getContext('2d');

  const img = new Image();
  img.onload = () => {
    const cardPad = 30;
    const imgW = 480;
    const imgH = Math.round(imgW * (img.height / img.width));
    const stripW = 180;
    const totalW = cardPad * 2 + imgW + 20 + stripW;
    const totalH = cardPad * 2 + Math.max(imgH, 400);
    const contentH = totalH - cardPad * 2;

    exportCanvas.width = totalW;
    exportCanvas.height = totalH;

    // Background
    ectx.fillStyle = '#f5f0eb';
    roundRect(ectx, 0, 0, totalW, totalH, 16);
    ectx.fill();

    // Photo with rounded corners
    ectx.save();
    roundRect(ectx, cardPad, cardPad, imgW, contentH, 12);
    ectx.clip();
    ectx.drawImage(img, cardPad, cardPad, imgW, contentH);
    ectx.restore();

    // Color strips
    const stripX = cardPad + imgW + 20;
    const gap = 6;
    const n = currentColors.length;
    const stripH = (contentH - (n - 1) * gap) / n;

    currentColors.forEach(([r, g, b], i) => {
      const y = cardPad + i * (stripH + gap);
      ectx.fillStyle = `rgb(${r},${g},${b})`;
      roundRect(ectx, stripX, y, stripW, stripH, 8);
      ectx.fill();

      const hex = rgbToHex(r, g, b);
      ectx.fillStyle = textColor(r, g, b);
      ectx.font = '600 14px Courier New';
      ectx.textAlign = 'center';
      ectx.textBaseline = 'middle';
      ectx.fillText(hex, stripX + stripW / 2, y + stripH / 2);
    });

    // Download
    const link = document.createElement('a');
    link.download = 'sky-palette.png';
    link.href = exportCanvas.toDataURL('image/png');
    link.click();
  };
  img.src = currentImgSrc;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
</script>
</body>
</html>
